
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Registration Form</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>

<header>
    <h1>Student Registration</h1>
    <p>Online Application Portal</p>
</header>

<main class="container">
    <section class="form-card">
        <div class="form-heading">
            <span class="tag">APPLICATION FORM</span>
            <h2>Register Here</h2>
            <p>Please enter your details to complete registration.</p>
        </div>

        <form id="registrationForm" action="submit.php" method="POST">

            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name"
                       placeholder="Enter your full name" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email"
                           placeholder="example@email.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="tel" id="phone" name="phone"
                           placeholder="10-digit mobile number"
                           pattern="[0-9]{10}" maxlength="10" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="dob">Date of Birth *</label>
                    <input type="date" id="dob" name="dob" required>
                </div>

                <div class="form-group">
                    <label for="gender">Gender *</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select gender</option>
                        <option value="Female">Female</option>
                        <option value="Male">Male</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="course">Course Applied For *</label>
                <select id="course" name="course" required>
                    <option value="">Select a course</option>
                    <option value="Computer Science Engineering">
                        Computer Science Engineering
                    </option>
                    <option value="Information Science Engineering">
                        Information Science Engineering
                    </option>
                    <option value="Electronics and Communication">
                        Electronics and Communication
                    </option>
                    <option value="Mechanical Engineering">
                        Mechanical Engineering
                    </option>
                    <option value="Civil Engineering">
                        Civil Engineering
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="address">Address *</label>
                <textarea id="address" name="address" rows="3"
                          placeholder="Enter your complete address"
                          required></textarea>
            </div>

            <label class="checkbox-label">
                <input type="checkbox" id="declaration"
                       name="declaration" value="yes" required>
                I confirm that the information provided is correct.
            </label>

            <p id="message" role="alert"></p>

            <button type="submit">Submit Application</button>
            <button type="reset" class="reset-btn">Clear Form</button>
        </form>
    </section>

    <p class="note">Fields marked with * are compulsory.</p>
</main>

<footer>
    <p>&copy; <span id="year"></span> Student Registration Portal</p>
</footer>

</body>
</html>
